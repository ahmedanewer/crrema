<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="45%" stop-color="#FFBE18" />
      <stop offset="100%" stop-color="#E59B00" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 5)">
    <!-- Leaves at top -->
    <!-- Left Leaf -->
    <path d="M 235 90 C 220 60, 205 70, 215 110 C 230 115, 245 105, 235 90 Z" 
          fill="url(#goldGrad)" />
    <!-- Right Leaf -->
    <path d="M 260 85 C 285 70, 290 85, 275 112 C 260 115, 250 100, 260 85 Z" 
          fill="url(#goldGrad)" />

    <!-- Organic Swirl / Spiral Emblem -->
    <!-- Outer swirl body curving inwards -->
    <path d="M 250 145 
             C 175 145, 160 215, 175 270 
             C 195 330, 280 345, 325 300 
             C 365 260, 360 205, 335 165
             C 328 153, 316 160, 321 172
             C 340 205, 340 250, 305 285
             C 270 320, 205 305, 192 255
             C 180 205, 205 165, 260 162
             C 285 160, 310 180, 305 210
             C 300 238, 270 252, 245 240
             C 225 230, 222 210, 235 198
             C 245 188, 262 195, 260 208
             C 258 218, 248 220, 245 215
             C 238 200, 260 185, 278 205
             C 288 220, 278 248, 250 252
             C 215 256, 195 220, 210 180
             C 225 145, 255 145, 250 145 Z" 
          fill="url(#goldGrad)" />
          
    <!-- Wordmark: CremaVera -->
    <g transform="translate(250, 395)" text-anchor="middle">
      <text font-family="'Brush Script MT', 'Dancing Script', 'Caveat', 'Great Vibes', 'Allura', cursive, sans-serif" 
            font-size="82" 
            font-weight="bold" 
            font-style="italic"
            letter-spacing="1" 
            fill="url(#goldGrad)">
        CremaVera
      </text>
      <!-- Brush flourish underline under Vera -->
      <path d="M 15 18 Q 80 14 175 16 Q 100 24 15 18 Z" fill="url(#goldGrad)" />
    </g>
  </g>
</svg>
